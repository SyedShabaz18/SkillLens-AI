services:
  - type: web
    name: skilllens-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SKILLLENS_SECRET_KEY
        generateValue: true
      - key: SKILLLENS_HTTPS_ONLY
        value: "1"
